# Copy this file to config/douyinfire.yaml and edit it locally.
data_dir: data
log_dir: logs
screenshot_dir: screenshots
headless: false
failure_notify_threshold: 1

schedule:
  time: "00:05"
  jitter_minutes: 20
  min_contact_interval_seconds: 10

timeouts:
  home_ready_seconds: 5
  message_panel_seconds: 8
  contact_search_seconds: 15
  input_box_seconds: 10
  after_send_seconds: 2

users:
  - name: "main"
    enabled: true
    contacts:
      - "联系人昵称"
    message: "续火花咯"
