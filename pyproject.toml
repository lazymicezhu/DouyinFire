[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "douyinfire"
version = "0.2.2"
description = "Local graphical Douyin automation with isolated accounts and verified task records."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright==1.60.0",
    "typer==0.25.1",
    "rich==14.3.4",
    "PyYAML==6.0.1",
]

[project.scripts]
douyinfire = "douyinfire.cli:app"

[tool.setuptools.packages.find]
include = ["douyinfire*"]
